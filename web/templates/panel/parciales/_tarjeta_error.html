{# Error dentro de una tarjeta del panel: el resto de la página sigue. Parámetro: texto. #}
<div class="flex flex-col items-start gap-2 rounded-box border-2 border-dashed border-error bg-base-100 p-4" role="status">
  <p class="font-medium text-error">No pudimos cargar esta parte.</p>
  <p class="text-sm text-suave">{{ texto|default:"El servicio no respondió." }} El resto del panel funciona.</p>
  <a href="{{ request.get_full_path }}" class="btn btn-sm btn-outline btn-primary">Intentar de nuevo</a>
</div>
