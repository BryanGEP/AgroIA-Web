{# Pedir otra vez la respuesta a la última pregunta, sin volver a guardarla. #}
<form method="post" action="{% url 'agroia:reintentar' conversacion_id %}"
      hx-post="{% url 'agroia:reintentar' conversacion_id %}" hx-target="#mensajes" hx-swap="beforeend"
      hx-indicator="#escribiendo" class="flex items-center gap-3 rounded-box border border-warning/40 bg-warning/10 p-3">
  {% csrf_token %}
  <p class="flex-1 text-sm">Tu última pregunta no tiene respuesta todavía.</p>
  <button type="submit" class="btn btn-sm">Reintentar</button>
</form>
