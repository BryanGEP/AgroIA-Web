{% comment %} Botón de dictado por voz del widget (componente `microfono`, Web Speech API).
   Solo aparece si el navegador tiene la API (x-cloak lo oculta mientras tanto y sin
   JavaScript). El primer uso pide aceptar el aviso de privacidad (ver _microfono_avisos).
   {% endcomment %}
<button type="button" x-show="disponible" x-cloak @click="alternar"
        :aria-pressed="pulsado" :aria-label="etiqueta" :title="etiqueta" :class="claseBoton"
        class="btn btn-square">
  <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true" focusable="false"><path class="fill-current" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>
