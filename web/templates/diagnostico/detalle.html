{% extends "base.html" %}
{% block titulo %}Diagnóstico{% endblock %}
{% block contenido %}
<div class="max-w-4xl mx-auto px-4 py-10 md:py-14">
  <a href="{% url 'diagnostico:historial' %}" class="link text-sm">Volver a mis diagnósticos</a>
  <h1 class="mt-3 mb-6 text-3xl">Diagnóstico del {{ diagnostico.creado_en|slice:":10" }}</h1>
  <div class="grid gap-8 md:grid-cols-2">
    <figure class="overflow-hidden rounded-box border border-base-300 bg-base-200">
      <img src="{% url 'diagnostico:imagen' diagnostico.id %}" alt="Foto analizada" class="w-full object-contain">
    </figure>
    {% include "diagnostico/parciales/_clasificacion.html" %}
  </div>
</div>
{% endblock %}
