{% comment %} Cambia entre el tema claro y el oscuro y recuerda la elección (Alpine + $persist).
   Sin elección guardada, sigue la preferencia del sistema. Sin JavaScript no se muestra. {% endcomment %}
<div x-data="{
       tema: $persist(null).as('agroia-tema'),
       get oscuro() { return this.tema ? this.tema === 'agroia-oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches },
       alternar() { this.tema = this.oscuro ? 'agroia' : 'agroia-oscuro'; document.documentElement.dataset.theme = this.tema }
     }" x-cloak>
  <button type="button" class="btn btn-ghost btn-sm btn-square" @click="alternar()"
          :aria-label="oscuro ? 'Usar tema claro' : 'Usar tema oscuro'" :aria-pressed="oscuro.toString()" style="display:none" x-show="true">
    <svg x-show="!oscuro" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg x-show="oscuro" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>
