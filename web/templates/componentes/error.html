{# Mensaje de error con una acción. Parámetros: titulo, texto, enlace, accion. #}
<div class="flex flex-col items-start gap-4 py-16">
  <h1 class="text-3xl">{{ titulo }}</h1>
  {% if texto %}<p class="max-w-prose text-lg">{{ texto }}</p>{% endif %}
  {% if enlace %}<a href="{{ enlace }}" class="btn btn-primary">{{ accion }}</a>{% endif %}
</div>
