<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ asunto }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6ef;font-family:Arial,Helvetica,sans-serif;color:#1f2a1a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6ef;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#3f6b2a;padding:20px 24px;color:#ffffff;font-size:22px;font-weight:bold;">
              AgroIA
            </td>
          </tr>
          <tr>
            <td style="padding:24px;font-size:15px;line-height:1.5;">
              {% block contenido %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background-color:#eef2e6;color:#5b6b52;font-size:12px;line-height:1.4;">
              Este correo fue enviado automáticamente, no respondas.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
