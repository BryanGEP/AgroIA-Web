[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agroia-comun"
version = "0.4.0"
description = "Código compartido de AgroIA-Web: autenticación JWT, permisos, formato de errores y eventos con Redis Streams."
requires-python = ">=3.12"
# Núcleo sin Django: lo instala también svc-ia (FastAPI), que usa agroia_comun.eventos.
# Los servicios Django instalan además el extra [django] (`pip install -e /comun[django]`).
# Django y DRF los fija cada servicio. Estas versiones deben coincidir con las de sus
# requirements.txt.
dependencies = [
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "redis==8.1.0",
]

[project.optional-dependencies]
django = [
    "djangorestframework-simplejwt==5.5.1",
    # agroia_comun.filtros (filtros de fecha del panel). La misma versión que los servicios.
    "django-filter==26.2",
]

[tool.setuptools.packages.find]
include = ["agroia_comun*"]
